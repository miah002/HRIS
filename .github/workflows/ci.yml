name: CI

on:
  push:
    branches: [dev, "claude/**"]
  pull_request:
    branches: ["claude/**"]

jobs:
  check:
    name: Type-check & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./dev.db

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
